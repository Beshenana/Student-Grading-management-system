
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SGMS</title>
</head>
<body>

    <header>
        <h1>Student Grading Management System</h1>
        <p>Haramaya University</p>
    </header>

    <nav>
        <a href="../../index.html">Home</a> |
        <a href="login.html">Login</a>
    </nav>

    <main>
        <section>
            <h2>Forgot Your Password?</h2>

            <p>
                Enter your registered email address to request
                assistance recovering your account.
            </p>

            <form action="#" method="post">

                <p>
                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </p>

                <button type="submit">Submit Request</button>

            </form>

            <p>
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Grading Management System</p>
        <p>Haramaya University</p>
    </footer>

</body>
</html>
